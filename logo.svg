<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="green"
      x1="25"
      y1="20"
      x2="175"
      y2="185"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#17634D"/>
      <stop offset="0.55" stop-color="#0A4234"/>
      <stop offset="1" stop-color="#041F18"/>
    </linearGradient>

    <linearGradient
      id="gold"
      x1="40"
      y1="30"
      x2="165"
      y2="175"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFD28C"/>
      <stop offset="0.5" stop-color="#F39A3E"/>
      <stop offset="1" stop-color="#C86725"/>
    </linearGradient>

    <linearGradient
      id="plate"
      x1="60"
      y1="90"
      x2="140"
      y2="155"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8EBD7"/>
    </linearGradient>

    <filter
      id="shadow"
      x="10"
      y="10"
      width="180"
      height="185"
      filterUnits="userSpaceOnUse"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="7"
        flood-color="#00140F"
        flood-opacity="0.38"
      />
    </filter>
  </defs>

  <!-- Circular background -->

  <circle
    cx="100"
    cy="100"
    r="96"
    fill="url(#green)"
  />

  <circle
    cx="100"
    cy="100"
    r="88"
    stroke="url(#gold)"
    stroke-width="3.5"
  />

  <!-- Upper rescue arrow -->

  <path
    d="M43 76C52 45 80 29 109 32C128 34 145 44 156 58"
    stroke="url(#gold)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <path
    d="M150 43L161 63L139 64"
    stroke="url(#gold)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Food plate -->

  <g filter="url(#shadow)">
    <path
      d="M48 94H152"
      stroke="#FFF8EA"
      stroke-width="9"
      stroke-linecap="round"
    />

    <path
      d="M54 100C59 132 75 151 100 151C125 151 141 132 146 100Z"
      fill="url(#plate)"
      stroke="#FFF8EA"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <path
      d="M67 112C74 132 84 140 100 140C116 140 126 132 133 112"
      stroke="#0A4234"
      stroke-opacity="0.17"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>

  <!-- Heart -->

  <path
    d="M100 134C96 131 78 120 78 108C78 98 89 93 100 102C111 93 122 98 122 108C122 120 104 131 100 134Z"
    fill="url(#gold)"
  />

  <!-- Lower rescue arrow -->

  <path
    d="M157 128C146 159 117 174 88 169C69 166 53 155 43 141"
    stroke="url(#gold)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <path
    d="M50 155L38 136L60 133"
    stroke="url(#gold)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- AI badge -->

  <circle
    cx="148"
    cy="143"
    r="22"
    fill="#FFF8EA"
    stroke="#0A4234"
    stroke-width="4"
  />

  <circle
    cx="148"
    cy="143"
    r="17"
    fill="url(#gold)"
  />

  <text
    x="148"
    y="149"
    text-anchor="middle"
    fill="#082B22"
    font-family="Arial, sans-serif"
    font-size="17"
    font-weight="900"
  >
    AI
  </text>
</svg>